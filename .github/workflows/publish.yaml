name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest

    environment: release

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version

      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi

          tag_version="${tag#v}"

          cargo_version="$(
            cargo metadata \
              --no-deps \
              --format-version 1 |
            jq -r '.packages[] | select(.name == "elsewhere") | .version'
          )"

          if [[ -z "$cargo_version" || "$cargo_version" == "null" ]]; then
            echo "Could not determine Elsewhere version from Cargo.toml"
            exit 1
          fi

          if [[ "$tag_version" != "$cargo_version" ]]; then
            echo "Release tag does not match Cargo.toml"
            echo "Tag:        $tag_version"
            echo "Cargo.toml: $cargo_version"
            exit 1
          fi

          echo "Publishing Elsewhere $cargo_version"

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Verify package
        run: cargo package --locked

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

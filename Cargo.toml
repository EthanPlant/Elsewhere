[package]
name = "elsewhere"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A local POSSE and cross-posting CLI for static-site writers."
repository = "https://github.com/EthanPlant/Elsewhere"
homepage = "https://ethanplant.ca/projects/elsewhere/"
readme = "README.md"
keywords = ["posse", "indieweb", "cli", "syndication", "static-site"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3.27.0"
